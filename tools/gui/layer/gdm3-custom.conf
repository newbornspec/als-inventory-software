# GDM configuration - ALS Audit Station.
#
# This REPLACES the stock file from minimal.squashfs, because our layer is the
# leftmost lowerdir in casper's overlay and therefore wins.
#
# EVERY KEY BELOW IS UNCOMMENTED ON PURPOSE. casper's
# /scripts/casper-bottom/15autologin patches this file at boot with four sed
# expressions, and every one of them is anchored to a leading '#':
#     s/^#[ ]*AutomaticLoginEnable =.*$/AutomaticLoginEnable=true/
#     s/^#[ ]*AutomaticLogin =.*$/AutomaticLogin=$USERNAME/
#     s/^#[ ]*TimedLoginEnable =.*$/TimedLoginEnable=false/
#     s/^#[ ]*WaylandEnable=false$/WaylandEnable=false/
# Uncommented lines do not match, so casper's edit becomes a no-op and these
# values survive byte for byte. Do not re-comment any of them.
#
# WaylandEnable=false is not our preference - casper sets it on every live boot
# anyway, which is why the session is X11 and DISPLAY=:1. It is stated here so
# the file says what is true rather than leaving it to a hook.
[daemon]
WaylandEnable=false
AutomaticLoginEnable=true
AutomaticLogin=ubuntu
TimedLoginEnable=false


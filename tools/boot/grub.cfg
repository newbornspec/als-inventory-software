# ALS Audit Station - /boot/grub/grub.cfg for the Ubuntu 24.04 live stick
#
# Copy this over  <stick>\boot\grub\grub.cfg  BY HAND, from Windows.
# Keep the file it replaces. make-als-layer.sh already leaves a copy of the
# untouched Ubuntu one at  boot\grub\grub.cfg.als-orig  - if this stick has
# never been armed, take that copy yourself before you overwrite anything.
#
# ---------------------------------------------------------------------------
# WHAT THE OPERATOR SEES
#   Nothing. timeout_style=hidden draws no menu at all. Three seconds of black
#   (indistinguishable from the tail of POST), then the splash.
#
# HOW TO GET THE MENU BACK - two ways, and the first one is the one to trust
#
#   1. FROM WINDOWS, on any machine that can read the stick:
#        put a file called   als-menu.txt   in the ROOT of the stick.
#      Contents do not matter; it can be empty. The menu then stays up for 60
#      seconds on EVERY boot until you delete it again.
#      This needs no keyboard timing and no working screen on the target
#      machine, which is why it exists: a stick that will not boot is recovered
#      from the Windows side, not from the machine that is failing.
#
#   2. AT THE MACHINE: tap ESC repeatedly from the instant the screen goes
#      black. GRUB polls for a keypress on every pass of the hidden-timeout
#      loop, so ESC lands. Do NOT rely on holding SHIFT: that reads modifier
#      state through EFI_SIMPLE_TEXT_INPUT_EX_PROTOCOL, which a large number of
#      second-hand UEFI firmwares do not implement, and it fails silently.
#
#   Once the menu is up, 'e' edits the entry exactly as before. That recovery
#   path is intact - it is the reason timeout is 3 and not 0. With timeout=0
#   GRUB polls for a key exactly once and then boots, which is a race a human
#   cannot win, and there would be no way back in from the machine at all.
# ---------------------------------------------------------------------------

# `loadfont unicode`, not a path. GRUB resolves the bare name against
# $prefix/fonts/unicode.pf2, which is where the font actually is on this stick
# (/boot/grub/fonts/unicode.pf2, 2.4MB) - there is no /boot/grub/font.pf2 and
# never was. With a path that does not resolve, loadfont fails, the whole if
# block is skipped, gfxterm is never selected, and the console stays in text
# mode - so gfxpayload=keep then hands the kernel a text mode and the splash
# starts on the wrong footing. This is the line the stock grub.cfg uses.
if loadfont unicode ; then
	set gfxmode=auto
	insmod efi_gop
	insmod efi_uga
	insmod gfxterm
	terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set default=0
set timeout_style=hidden
set timeout=3

# The Windows escape hatch. Four spellings on purpose: GRUB's FAT lookup is
# case-insensitive but that is not worth betting a dead machine on, and
# Explorer hides extensions, so the file the operator thinks is "als-menu" is
# very often "als-menu.txt".
function als_show_menu {
	set timeout_style=menu
	set timeout=60
}
if [ -f /als-menu ]      ; then als_show_menu ; fi
if [ -f /als-menu.txt ]  ; then als_show_menu ; fi
if [ -f /ALS-MENU ]      ; then als_show_menu ; fi
if [ -f /ALS-MENU.TXT ]  ; then als_show_menu ; fi

# --- 0 - the appliance ------------------------------------------------------
# als-splash.img is a second cpio archive that the KERNEL concatenates onto
# Ubuntu's own initramfs - the same mechanism early CPU microcode uses. It
# carries nothing but the ALS plymouth theme. /casper/initrd is not touched.
#
# DELETE als-splash.img FROM WINDOWS and this entry falls back to Ubuntu's own
# splash on the next boot: the `if` below drops the second initrd, and
# plymouth.splash=als then names a theme that is not there, so plymouthd walks
# on to its next candidate, which is Ubuntu's. No grub.cfg editing, no rebuild.
# That is the undo, and it is one file deletion.
#
# plymouth.splash= is the HIGHEST-priority theme selector plymouthd has - above
# /etc/plymouth/plymouthd.conf, above plymouthd.defaults, above the
# default.plymouth alternative. The archive ships plymouthd.conf as well, so
# either mechanism on its own is enough.
menuentry "ALS Audit Station" {
	set gfxpayload=keep
	linux	/casper/vmlinuz layerfs-path=minimal.standard.live.als.squashfs --- quiet splash plymouth.splash=als vt.global_cursor_default=0
	# Unconditional. The `if [ -f /als-splash.img ]` that used to wrap this is
	# gone: on the first real boot it evidently took the else branch, because
	# Ubuntu's own splash appeared even though the archive is on the stick and
	# its theme is well-formed. GRUB's file test resolves against $root, and
	# $root at that moment is not something worth betting the result on twice.
	#
	# The undo is no longer "delete als-splash.img" - deleting it now makes
	# GRUB report a missing file and drop to its shell, from which the other
	# entries still boot. The real undo is restoring grub.cfg.als-prev from
	# Windows, which is on the stick.
	initrd	/casper/initrd /als-splash.img
}

# --- 0b - THE TEST -----------------------------------------------------------
# Identical to entry 0 except that the second initrd is loaded UNCONDITIONALLY,
# with no `if [ -f ]` around it.
#
# Entry 0 showed Ubuntu's splash on the first real boot even though
# als-splash.img is definitely on the stick and the theme inside it is
# well-formed - two-step module, correct ImageDir, valid PNGs, plymouthd.conf
# naming it. The remaining suspect is the file test itself: if GRUB's $root is
# not the stick at that moment, `[ -f /als-splash.img ]` is false, the else
# branch loads only /casper/initrd, and the theme is simply absent - which
# makes plymouthd fall back to Ubuntu's, silently and exactly as observed.
#
# If THIS entry shows the ALS splash and entry 0 does not, the conditional is
# the bug and entry 0 loses it. If this one also shows Ubuntu's splash, the
# archive is not being unpacked at all and the fault is elsewhere.
#
# Reach it with ESC at boot. It is not the default and changes nothing.
menuentry "ALS Audit Station (TEST - force ALS splash)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz layerfs-path=minimal.standard.live.als.squashfs --- quiet splash plymouth.splash=als vt.global_cursor_default=0
	initrd	/casper/initrd /als-splash.img
}

# --- 1 - same machine, Ubuntu's splash --------------------------------------
# The A/B test. If entry 0 is black and this one is not, the splash is at
# fault; if both are black, it is not.
menuentry "ALS Audit Station (Ubuntu splash)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz layerfs-path=minimal.standard.live.als.squashfs --- quiet splash
	initrd	/casper/initrd
}

# --- 2 - every boot message on screen ---------------------------------------
# No quiet, no splash. This is what you boot when something is wrong and you
# need the machine to tell you what.
menuentry "ALS Audit Station (verbose - show all boot messages)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz layerfs-path=minimal.standard.live.als.squashfs ---
	initrd	/casper/initrd
}

# --- 3 - no ALS layer at all ------------------------------------------------
menuentry "Plain Ubuntu (no ALS layer, verbose)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz ---
	initrd	/casper/initrd
}

# --- 4 - awkward GPUs -------------------------------------------------------
menuentry "Plain Ubuntu (safe graphics)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz nomodeset ---
	initrd	/casper/initrd
}

grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
fi

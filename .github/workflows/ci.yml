# CI for every PR and push to master. Mirrors the local verification that has
# caught real bugs in this repo — most notably the 55P04 class: a migration
# that works on the long-lived production database but kills every FRESH one,
# because TypeORM runs the whole chain in a single transaction. Vercel builds
# the web app on every PR already, so this deliberately covers what Vercel
# cannot: API typecheck, the test suite, the full migration chain from
# scratch against a real Postgres, the seed, the newest migration's down/up,
# and an API boot smoke (Nest DI failures only surface at runtime — tsc
# passes happily with a missing provider).
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  tools:
    # The Audit Station's own tests: the wipe ladder, the wipe gate, the lock
    # checks, the boot guard... Until this job existed they only ran when
    # someone remembered to run them by hand on a Linux box, so a change to the
    # engine that erases customer drives could merge with every one of them red.
    #
    # A GLOB, not a list. Every tools/test-*.sh runs with bash and every
    # tools/test-*.py with python3, so a new test is picked up the moment it is
    # committed - a hand-maintained list is exactly the thing that silently
    # stops covering the newest test.
    #
    # No Postgres, no npm: these tests are bash + python3 stdlib by rule, and
    # they stub every destructive tool (a wipe test points at a temp REGULAR
    # FILE, never a /dev node). Every test runs even after one fails, each gets
    # a PASS/FAIL line, and the job fails if any did.
    name: tool tests (tools/test-*.sh, tools/test-*.py)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Test prerequisites
        # gpg: test-layer-esr-fetch.sh verifies real (throwaway) keys the way
        # make-als-layer.sh verifies Mozilla's. Present on ubuntu-latest today;
        # installed explicitly so an image change cannot turn it into a red
        # that has nothing to do with the code.
        run: |
          command -v gpg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gnupg; }
          gpg --version | head -1

      - name: Run every tools/test-* script
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          python3 --version
          bash --version | head -1
          tests=(tools/test-*.sh tools/test-*.py)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "no tools/test-* scripts found - refusing to report green on nothing"
            exit 1
          fi
          passed=(); failed=()
          for t in "${tests[@]}"; do
            case "$t" in
              *.sh) runner=bash ;;
              *.py) runner=python3 ;;
            esac
            echo "::group::$t"
            # stdin from /dev/null: a test that stops to prompt must fail, not
            # hang the job until the timeout. timeout: one wedged test must not
            # hide the results of the others.
            if timeout 300 "$runner" "$t" </dev/null; then rc=0; else rc=$?; fi
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "PASS  $t"; passed+=("$t")
            else
              echo "::error title=tool test failed::$t exited $rc"
              echo "FAIL  $t  (exit $rc)"; failed+=("$t")
            fi
          done
          echo
          echo "=== tool tests: ${#passed[@]} passed, ${#failed[@]} failed of ${#tests[@]} ==="
          for t in "${passed[@]}"; do echo "  PASS  $t"; done
          for t in "${failed[@]}"; do echo "  FAIL  $t"; done
          [ "${#failed[@]}" -eq 0 ]

  api:
    name: typecheck, tests, migrations, boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: als_inventory
          POSTGRES_PASSWORD: als_inventory_ci
          POSTGRES_DB: als_inventory
        ports:
          - 5432:5432
        # Don't start the steps until the database is actually accepting
        # connections — migration:run against a half-started container is a
        # flaky red that teaches people to ignore CI.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: als_inventory
      DB_PASSWORD: als_inventory_ci
      DB_NAME: als_inventory

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (workspace root)
        run: npm ci

      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Typecheck web
        # Vercel runs the full Next build on PRs; this is the fast tsc-level
        # signal so a web type error fails here in seconds, not there in minutes.
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: API tests
        run: npm test --workspace=apps/api

      - name: Migration chain from scratch
        # The 55P04 net. Every migration, one transaction, empty database —
        # exactly what a rebuilt Railway DB, CI, or a new developer machine runs.
        working-directory: apps/api
        run: npm run migration:run

      - name: Seed
        working-directory: apps/api
        run: npm run seed

      - name: Newest migration reverts and re-applies
        # Proves the latest down() actually works and that re-running up()
        # against LIVE data (the seed) is safe — the same revert/re-run dance
        # used to dry-run every migration in this repo before shipping it.
        working-directory: apps/api
        run: |
          npm run migration:revert
          npm run migration:run

      - name: API boots against the migrated schema
        # DI wiring is runtime-only: a guard with an unprovided dependency
        # passes tsc and kills the app at startup. Boot the compiled server
        # and require the public health root to answer.
        working-directory: apps/api
        env:
          PORT: '3100'
        run: |
          npm run build
          node dist/main.js &
          APP=$!
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://localhost:3100/ >/dev/null; then
              echo "API boot OK"
              kill $APP
              exit 0
            fi
          done
          echo "API failed to boot within 60s"
          kill $APP || true
          exit 1
